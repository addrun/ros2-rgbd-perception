name: ros-jazzy
on: [push, pull_request]
jobs:
  build-and-demo:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install offline-demo dependencies
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-pytest python3-opencv python3-numpy ros-jazzy-cv-bridge ros-jazzy-message-filters
      - name: Build and test
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install
          source install/setup.bash
          python3 -m pytest -q
          colcon test --event-handlers console_cohesion+
          colcon test-result --verbose
      - name: Verify ROS messages with both depth encodings
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          export ROS_DOMAIN_ID=87
          export ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
          python3 scripts/ros_smoke.py --encoding 16UC1
          python3 scripts/ros_smoke.py --encoding 32FC1
